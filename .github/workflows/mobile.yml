name: Mobile shells

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer published by Google.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test -- --pool=threads
      - run: npm run mobile:build:android
      - run: npm run mobile:bundle:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-and-unsigned-release-aab
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xcodebuild -version
      - run: npm run mobile:build:ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-not-for-devices
          path: .mobile-build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
